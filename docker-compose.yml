services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: retailiq
      POSTGRES_PASSWORD: retailiq_dev_password
      POSTGRES_DB: retailiq
    ports:
      - "5432:5432"
    volumes:
      - retailiq_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retailiq"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  retailiq_postgres:
